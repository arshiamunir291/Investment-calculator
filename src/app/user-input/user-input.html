<form (ngSubmit)="onSubmit()">
    <div class="input-group">
        <p>
            <label for="initial-investment">Initial Investment</label>
            <input id="initial-investment" type="number"  name="initial-investment" [value]="enteredInitialInvestment()" (input)="enteredInitialInvestment.set(($any($event.target).valueAsNumber) || 0)" />
        </p>
        <p>
            <label for="annual-investment">Annual Investment</label>
            <input id="annual-investment" type="number"  name="annual-investment" [value]="enteredAnnualInvestment()" (input)="enteredAnnualInvestment.set(($any($event.target).valueAsNumber) || 0)" />
        </p>
    </div>
    <div class="input-group">
        <p>
            <label for="expected-return" >Expcted Return</label>
            <input id="expected-return" type="number"  name="expected-return"  [value]="enteredExpectedReturn()" (input)="enteredExpectedReturn.set(($any($event.target).valueAsNumber) || 0)" />
        </p>
        <p>
            <label for="duration">Duration</label>
            <input id="duration" type="number" name="duration"  [value]="entredDuration()" (input)="entredDuration.set(($any($event.target).valueAsNumber) || 0)" />
        </p>
    </div> 
    <p>
        <button>Calculate</button>
    </p> 
</form>
